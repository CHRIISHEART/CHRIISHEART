name: Serpent

# Dessine un serpent qui mange la grille de contributions (Platane/snk),
# aux couleurs de la Martinique : serpent rouge, cases vertes.
# Les images sont publiées sur la branche « output » et affichées dans le README.

on:
  schedule:
    - cron: "0 */12 * * *"   # toutes les 12 heures
  workflow_dispatch:         # bouton « Run workflow » dans l'onglet Actions
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/serpent-sombre.svg?color_snake=#ff4f3d&color_dots=#1d2830,#16a06c,#1fcf8a,#4fe3a4,#8ff3c6
            dist/serpent-clair.svg?color_snake=#e8263d&color_dots=#ebedf0,#7fe0b4,#1fcf8a,#14a56f,#0b7a52

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
