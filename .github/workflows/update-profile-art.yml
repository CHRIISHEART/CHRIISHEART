name: Mise à jour du profil

on:
  schedule:
    - cron: "17 6 * * *"   # tous les jours vers 06:17 UTC
  workflow_dispatch:       # bouton « Run workflow » dans l'onglet Actions
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/fetch_contributions.py
      # serpent rouge qui mange la grille, intégré au panneau « Chaque jour, en vert »
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: dist/serpent.svg?color_snake=#ff4f3d&color_dots=#1d2830,#16a06c,#1fcf8a,#4fe3a4,#8ff3c6
      - run: python scripts/render_readme_cards.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Mise à jour du profil [skip ci]"
          file_pattern: "data/contributions.json cards/*.svg"
