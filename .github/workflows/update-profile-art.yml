name: Mise à jour du profil

on:
  schedule:
    - cron: "17 6 * * *"   # tous les jours vers 06:17 UTC
  workflow_dispatch:       # bouton « Run workflow » dans l'onglet Actions
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/fetch_contributions.py
      - run: python scripts/generate_streak_svg.py
      - run: python scripts/render_stats_svg.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Mise à jour du profil [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg stats.svg"
